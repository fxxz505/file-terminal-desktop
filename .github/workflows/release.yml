name: Release desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend contract tests
        run: npm test

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build signed release and publish assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '资料终端 ${{ github.ref_name }}'
          releaseBody: 'Windows 安装包与应用内自动更新发布。'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Package portable bundle
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path src-tauri/target/release -Filter '*.exe' | Where-Object { $_.Name -notmatch 'setup' } | Select-Object -First 1
          if (-not $bundle) { throw 'Portable executable was not found.' }
          $portableRoot = Join-Path $env:RUNNER_TEMP '资料终端便携版'
          New-Item -ItemType Directory -Force -Path $portableRoot | Out-Null
          Copy-Item -LiteralPath $bundle.FullName -Destination (Join-Path $portableRoot '资料终端.exe')
          @"
          双击“资料终端.exe”启动。
          用户数据会自动保存在此文件同级的“资料终端数据”文件夹。
          更新时请只替换 exe 文件，不要删除“资料终端数据”。
          "@ | Set-Content -LiteralPath (Join-Path $portableRoot '使用说明.txt') -Encoding utf8
          Compress-Archive -Path $portableRoot -DestinationPath (Join-Path $env:RUNNER_TEMP '资料终端便携版-win-x64.zip') -Force

      - name: Upload portable bundle to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ runner.temp }}/资料终端便携版-win-x64.zip
