name: Verify desktop app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Frontend tests
        run: npm test
      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust unit and integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Production frontend build
        run: npm run build
  desktop-e2e:
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend assets for Tauri WebView
        run: npm run build
      - name: Ensure WebView2 Runtime
        shell: pwsh
        run: |
          $runtime = Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $runtime) {
            $bootstrap = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrap
            Start-Process $bootstrap -ArgumentList '/silent', '/install' -Wait
          }
          $runtime = Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $runtime) { throw 'WebView2 Runtime is not available on the Windows runner' }
          Write-Host "Using WebView2 Runtime: $($runtime.FullName)"
      - name: Build Tauri debug application
        run: cargo build --manifest-path src-tauri/Cargo.toml
      - name: Install Tauri WebDriver bridge
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: Install matching Microsoft Edge WebDriver
        shell: pwsh
        run: |
          $edge = Get-ChildItem 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe', 'C:\Program Files\Microsoft\Edge\Application\msedge.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $edge) { throw 'Microsoft Edge executable was not found on the runner' }
          $version = $edge.VersionInfo.ProductVersion
          $download = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'edgedriver'
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          Invoke-WebRequest -Uri "https://msedgedriver.azureedge.net/$version/edgedriver_win64.zip" -OutFile $download
          Expand-Archive -Path $download -DestinationPath $extract -Force
          "$extract" | Out-File -FilePath $env:GITHUB_PATH -Append
          "EDGE_DRIVER_PATH=$extract\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using Edge $version with matching driver $extract\msedgedriver.exe"
      - name: Start Tauri WebDriver bridge
        shell: pwsh
        run: |
          $env:FILE_TERMINAL_TEST_DATA_DIR = Join-Path $env:RUNNER_TEMP 'file-terminal-e2e-data'
          $stdout = Join-Path $env:RUNNER_TEMP 'tauri-driver.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'tauri-driver.stderr.log'
          $driver = Start-Process tauri-driver -ArgumentList '--native-driver', $env:EDGE_DRIVER_PATH, '--port', '4444' -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru -WindowStyle Hidden
          "TAURI_DRIVER_PID=$($driver.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4444/status | Out-Null; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ready) { Get-Content $stdout, $stderr -ErrorAction SilentlyContinue; throw 'tauri-driver did not become ready on port 4444' }
      - name: Capture desktop process diagnostics
        if: always()
        shell: pwsh
        run: |
          Get-Process file-terminal-desktop, msedgedriver, tauri-driver -ErrorAction SilentlyContinue | Format-List *
          Get-ChildItem "$env:LOCALAPPDATA\Microsoft\EdgeWebView\Application" -ErrorAction SilentlyContinue
      - name: Run real Tauri WebView automation
        shell: pwsh
        env:
          TAURI_E2E_APP: ${{ github.workspace }}\src-tauri\target\debug\file-terminal-desktop.exe
          TAURI_E2E_ARTIFACTS: ${{ github.workspace }}\e2e-artifacts
          FILE_TERMINAL_TEST_DATA_DIR: ${{ runner.temp }}\file-terminal-e2e-data
        run: npm run test:tauri-e2e
      - name: Stop Tauri WebDriver bridge
        if: always()
        shell: pwsh
        run: if ($env:TAURI_DRIVER_PID) { Stop-Process -Id $env:TAURI_DRIVER_PID -Force -ErrorAction SilentlyContinue }
      - name: Upload WebDriver log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-driver-log
          path: |
            ${{ runner.temp }}/tauri-driver.stdout.log
            ${{ runner.temp }}/tauri-driver.stderr.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tauri-e2e-artifacts
          path: e2e-artifacts/
          retention-days: 14
