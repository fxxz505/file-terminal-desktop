name: Verify desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frontend dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Frontend tests
        run: npm test
      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust unit and integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Production frontend build
        run: npm run build
      - name: Build debug application for desktop E2E
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml
      - name: Upload desktop E2E application
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-app
          path: src-tauri/target/debug/file-terminal-desktop.exe
          if-no-files-found: error
  desktop-e2e:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend assets for Tauri WebView
        run: npm run build
      - name: Download desktop E2E application
        uses: actions/download-artifact@v4
        with:
          name: desktop-e2e-app
          path: src-tauri/target/debug
      - name: Ensure WebView2 Runtime
        shell: pwsh
        run: |
          $runtime = Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $runtime) {
            $bootstrap = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrap
            Start-Process $bootstrap -ArgumentList '/silent', '/install' -Wait
          }
          $runtime = Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $runtime) { throw 'WebView2 Runtime is not available on the Windows runner' }
          Write-Host "Using WebView2 Runtime: $($runtime.FullName)"
      - name: Install matching Microsoft Edge WebDriver
        shell: pwsh
        run: |
          # Tauri hosts its UI in WebView2, not the standalone Edge browser.  A browser-matched
          # driver may reject the WebView2 process when their patch versions differ.
          $webview = Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $webview) { throw 'WebView2 Runtime executable was not found on the runner' }
          $version = $webview.VersionInfo.ProductVersion
          $download = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'edgedriver'
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          try {
            Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $download
            Expand-Archive -Path $download -DestinationPath $extract -Force
            $driverPath = Join-Path $extract 'msedgedriver.exe'
            if (-not (Test-Path $driverPath)) { throw 'Downloaded archive did not contain msedgedriver.exe' }
            $driverVersion = (& $driverPath --version)
            if ($driverVersion -notmatch [regex]::Escape($version)) {
              throw "EdgeDriver version mismatch. WebView2=$version; driver=$driverVersion"
            }
            Write-Host "Using WebView2 $version with matching driver $driverPath"
          } catch {
            $fallback = Get-Command msedgedriver -ErrorAction SilentlyContinue
            if (-not $fallback) { throw "Unable to download matching EdgeDriver for WebView2 $version. $($_.Exception.Message)" }
            $driverPath = $fallback.Source
            Write-Warning "Matching EdgeDriver download failed; using runner-provided driver $driverPath. $($_.Exception.Message)"
          }
          "EDGE_DRIVER_REAL_PATH=$driverPath" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build verbose EdgeDriver wrapper
        shell: pwsh
        run: |
          # tauri-driver starts the native driver itself and only accepts its executable path.
          # Compile a tiny .exe wrapper so the real EdgeDriver also emits a diagnostic log.
          $wrapperSource = Join-Path $env:RUNNER_TEMP 'edge-driver-wrapper.cs'
          $wrapperPath = Join-Path $env:RUNNER_TEMP 'edge-driver-wrapper.exe'
          $logPath = Join-Path $env:RUNNER_TEMP 'msedgedriver.verbose.log'
          @'
          using System;
          using System.Diagnostics;
          using System.IO;
          class EdgeDriverWrapper {
            public static int Main(string[] args) {
              var real = Environment.GetEnvironmentVariable("EDGE_DRIVER_REAL_PATH");
              var log = Environment.GetEnvironmentVariable("EDGE_DRIVER_LOG_PATH");
              if (String.IsNullOrWhiteSpace(real) || !File.Exists(real)) return 2;
              var forwarded = String.Join(" ", args);
              var extra = " --verbose" + (String.IsNullOrWhiteSpace(log) ? "" : " --log-path=" + log);
              var info = new ProcessStartInfo { FileName = real, Arguments = forwarded + extra, UseShellExecute = false, CreateNoWindow = true, RedirectStandardError = true };
              if (!String.IsNullOrWhiteSpace(log)) File.AppendAllText(log, "wrapper args=" + info.Arguments + Environment.NewLine);
              using (var process = Process.Start(info)) {
                var stderr = process.StandardError.ReadToEnd();
                process.WaitForExit();
                if (!String.IsNullOrWhiteSpace(log)) File.AppendAllText(log, "wrapper exit=" + process.ExitCode + Environment.NewLine + stderr + Environment.NewLine);
                return process.ExitCode;
              }
            }
          }
          '@ | Set-Content -LiteralPath $wrapperSource -Encoding UTF8
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { $csc = (Get-Command csc.exe -ErrorAction Stop).Source }
          & $csc /nologo /target:exe /out:$wrapperPath $wrapperSource
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $wrapperPath)) { throw 'Unable to compile EdgeDriver diagnostic wrapper' }
          "EDGE_DRIVER_PATH=$wrapperPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "EDGE_DRIVER_LOG_PATH=$logPath" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install Tauri WebDriver bridge
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: Start Tauri WebDriver bridge
        shell: pwsh
        run: |
          $testData = Join-Path $env:RUNNER_TEMP 'file-terminal-e2e-data'
          New-Item -ItemType Directory -Force -Path $testData | Out-Null
          $env:FILE_TERMINAL_TEST_DATA_DIR = $testData
          "FILE_TERMINAL_TEST_DATA_DIR=$testData" | Out-File -FilePath $env:GITHUB_ENV -Append
          $env:TAURI_AUTOMATION = 'true'
          $env:TAURI_WEBVIEW_AUTOMATION = 'true'
          $stdout = Join-Path $env:RUNNER_TEMP 'tauri-driver.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'tauri-driver.stderr.log'
          $driver = Start-Process tauri-driver -ArgumentList '--native-driver', $env:EDGE_DRIVER_PATH, '--port', '4444', '--native-port', '4445' -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru -WindowStyle Hidden
          "TAURI_DRIVER_PID=$($driver.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4444/status | Out-Null
              Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4445/status | Out-Null
              $ready = $true
              break
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ready) { Get-Content $stdout, $stderr -ErrorAction SilentlyContinue; throw 'Tauri/Edge WebDriver did not become ready on ports 4444/4445' }
      - name: Capture desktop process diagnostics
        if: always()
        shell: pwsh
        run: |
          Get-Process file-terminal-desktop, msedgedriver, tauri-driver -ErrorAction SilentlyContinue | Format-List *
          if ($env:EDGE_DRIVER_LOG_PATH -and (Test-Path $env:EDGE_DRIVER_LOG_PATH)) { Get-Content -LiteralPath $env:EDGE_DRIVER_LOG_PATH -ErrorAction SilentlyContinue }
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -in 4444,4445 } | Format-Table -AutoSize
          Get-ChildItem "$env:LOCALAPPDATA\Microsoft\EdgeWebView\Application" -ErrorAction SilentlyContinue
      - name: Run real Tauri WebView automation
        shell: pwsh
        env:
          TAURI_E2E_APP: ${{ github.workspace }}\src-tauri\target\debug\file-terminal-desktop.exe
          TAURI_E2E_ARTIFACTS: ${{ github.workspace }}\e2e-artifacts
          FILE_TERMINAL_TEST_DATA_DIR: ${{ runner.temp }}\file-terminal-e2e-data
          TAURI_WEBVIEW_PROFILE: ${{ runner.temp }}\file-terminal-webview-profile
          TAURI_NATIVE_DRIVER_URL: http://127.0.0.1:4445
        run: npm run test:tauri-e2e
      - name: Stop Tauri WebDriver bridge
        if: always()
        shell: pwsh
        run: if ($env:TAURI_DRIVER_PID) { Stop-Process -Id $env:TAURI_DRIVER_PID -Force -ErrorAction SilentlyContinue }
      - name: Upload WebDriver log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-driver-log
          path: |
            ${{ runner.temp }}/tauri-driver.stdout.log
            ${{ runner.temp }}/tauri-driver.stderr.log
            ${{ runner.temp }}/msedgedriver.verbose.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tauri-e2e-artifacts
          path: e2e-artifacts/
          retention-days: 14
