[package]
name = "file-terminal-desktop"
version = "0.1.16"
description = "A local-first file assistant"
authors = ["local"]
edition = "2021"

[lib]
name = "file_terminal_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.5.0", features = [] }
tauri-plugin-dialog = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.35", features = ["bundled-sqlcipher-vendored-openssl"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
zip = "4.2"
walkdir = "2.5"
uuid = { version = "1.16", features = ["v4"] }
url = "2.5"
thiserror = "2.0"
dirs = "6.0"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.9"
sha2 = "0.10"
keyring = "3.6"
regex = "1.11"
lopdf = "0.34"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
notify = "8.2"
tokio = { version = "1", features = ["macros", "time"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3.19"
